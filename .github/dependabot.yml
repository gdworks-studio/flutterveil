version: 2

# Automated dependency updates (Argus / dept 15). Weekly, GROUPED (minor+patch
# batched into one PR per ecosystem; majors stay individual for review). Each PR
# runs through the studio-os-gate; low-risk ones auto-merge (dependabot-automerge.yml).
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    # Do not adopt a release the day it ships. A compromised-package window is measured in
    # hours-to-days, and grouped auto-merge means an update can reach main with little human
    # attention, so the cooldown is what buys the ecosystem time to notice a bad release.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
